#
# Example PlatformIO configuration file for SSL and non-SSL builds.
# Both build this repository's library; its library.json pulls in the
# ESP8266 transport (ESP8266AsyncTCP).
#

[platformio]
default_envs = ssl

[env]
platform = espressif8266
framework = arduino
board = esp01_1m
lib_deps = symlink://../..

[env:ssl]
build_flags = -DASYNC_TCP_SSL_ENABLED=1

[env:nossl]
